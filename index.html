<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAB6 رابط — Digital Web Invitations</title>
  <meta http-equiv="refresh" content="0; url=Main%20Page/index.html" />
  <style>
    :root {
      --bg: #0d0a0b;
      --text: #f5f0eb;
      --accent: #d4af37;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    .loader-card {
      padding: 2.5rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(212, 175, 55, 0.2);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      max-width: 400px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: var(--accent);
      letter-spacing: 0.05em;
    }
    p {
      color: rgba(245, 240, 235, 0.7);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    a.btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      color: #0d0a0b;
      font-weight: 600;
      text-decoration: none;
      border-radius: 0.5rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a.btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
    }
  </style>
  <script>
    window.location.replace("Main Page/index.html");
  </script>
</head>
<body>
  <div class="loader-card">
    <h1>RAB6 رابط</h1>
    <p>Redirecting to the Luxury Digital Invitations Showcase...</p>
    <a href="Main Page/index.html" class="btn">Click here if not redirected</a>
  </div>
</body>
</html>
