<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>Mohammad & Yara — A Noir Soirée in Dubai</title>
  <meta name="description" content="You are warmly invited to celebrate the wedding of Mohammad and Yara — a dramatic midnight affair at Jumeirah Beach Hotel, Dubai, on the 14th of February 2027." />
  <meta property="og:title" content="Mohammad & Yara — A Noir Soirée in Dubai" />
  <meta property="og:description" content="An intimate, dramatic celebration under the stars above the Arabian Gulf. Jumeirah Beach Hotel · 14 February 2027." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Favicon -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&family=Pinyon+Script&family=Marhey:wght@400;500;700&display=swap"
  />

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Antigravity Particle Canvas ─────────────────────── -->
  <canvas id="antigravity-canvas"></canvas>

  <!-- ── Language Toggle ─────────────────────────────────── -->
  <button id="lang-toggle" class="glass-charm floating-element" aria-label="Switch language">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="9"/>
      <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>
    </svg>
    <span class="lang-label">العربية</span>
  </button>

  <!-- ── Preloader ─────────────────────────────────────────── -->
  <div id="preloader" aria-label="Open invitation"></div>

  <!-- ── Floating Debris ─────────────────────────────────── -->
  <div id="petals-container" aria-hidden="true"></div>

  <!-- ── Main Invitation ─────────────────────────────────── -->
  <main>

    <!-- ── HERO ─────────────────────────────────────────── -->
    <section id="hero">
      <div id="hero-bg">
        <img
          src="assets/Background.png"
          alt="Mohammad & Yara Wedding Cover"
          fetchpriority="high"
          style="width:100%;height:100%;object-fit:cover;object-position:center center;"
        />
        <div id="hero-overlay"></div>
      </div>

      <svg viewBox="0 0 60 100" class="hero-sprig-left sway-slow" aria-hidden="true">
        <g style="fill:currentColor;stroke:currentColor;stroke-width:0.5;opacity:0.5">
          <path d="M30 0 L30 100" fill="none"/>
          <ellipse cx="20" cy="20" rx="8" ry="3.5" transform="rotate(-30 20 20)" fill-opacity="0.4"/>
          <ellipse cx="40" cy="30" rx="8" ry="3.5" transform="rotate(30 40 30)"  fill-opacity="0.4"/>
          <ellipse cx="18" cy="45" rx="8" ry="3.5" transform="rotate(-30 18 45)" fill-opacity="0.4"/>
          <ellipse cx="42" cy="55" rx="8" ry="3.5" transform="rotate(30 42 55)"  fill-opacity="0.4"/>
          <ellipse cx="22" cy="72" rx="7" ry="3"   transform="rotate(-30 22 72)" fill-opacity="0.4"/>
          <ellipse cx="38" cy="82" rx="7" ry="3"   transform="rotate(30 38 82)"  fill-opacity="0.4"/>
        </g>
      </svg>
      <svg viewBox="0 0 60 100" class="hero-sprig-right sway-slow" aria-hidden="true">
        <g style="fill:currentColor;stroke:currentColor;stroke-width:0.5;opacity:0.5">
          <path d="M30 0 L30 100" fill="none"/>
          <ellipse cx="20" cy="20" rx="8" ry="3.5" transform="rotate(-30 20 20)" fill-opacity="0.4"/>
          <ellipse cx="40" cy="30" rx="8" ry="3.5" transform="rotate(30 40 30)"  fill-opacity="0.4"/>
          <ellipse cx="18" cy="45" rx="8" ry="3.5" transform="rotate(-30 18 45)" fill-opacity="0.4"/>
          <ellipse cx="42" cy="55" rx="8" ry="3.5" transform="rotate(30 42 55)"  fill-opacity="0.4"/>
          <ellipse cx="22" cy="72" rx="7" ry="3"   transform="rotate(-30 22 72)" fill-opacity="0.4"/>
          <ellipse cx="38" cy="82" rx="7" ry="3"   transform="rotate(30 38 82)"  fill-opacity="0.4"/>
        </g>
      </svg>

      <div id="hero-content" class="fade-up card-stock floating-element">
        <p id="hero-eyebrow" class="eyebrow"></p>

        <div class="hero-divider">
          <span></span>
          <div class="velvet-heart-pearl pulse-glow" aria-hidden="true">
            <svg class="svg-heart" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 21s-7-4.35-9.5-9C1 8.5 3 5 6.5 5c2 0 3.5 1 5.5 3 2-2 3.5-3 5.5-3C21 5 23 8.5 21.5 12 19 16.65 12 21 12 21z"/>
            </svg>
          </div>
          <span></span>
        </div>

        <h1>
          <span id="hero-title" class="hero-title shimmer-text"></span>
          <span id="hero-sub" class="eyebrow hero-sub"></span>
        </h1>

        <p id="hero-poem">
          <span id="hero-poem1"></span><br/>
          <span id="hero-poem2"></span><br/>
          <span id="hero-poem3"></span>
          <span id="hero-poem-love" class="poem-love"></span>
        </p>

        <!-- Noir Diamond Motif -->
        <div class="ornament noir-motif" aria-hidden="true">
          <span class="ornament-line-left"></span>
          <svg width="54" height="44" viewBox="0 0 60 44" class="ornament-icon sway-slow">
            <g fill="none" stroke="currentColor" stroke-width="0.9">
              <path d="M30 6 L38 20 L30 34 L22 20 Z" fill="rgba(201,149,107,0.15)"/>
              <path d="M30 2 V10 M58 20 H50 M30 38 V30 M2 20 H10"/>
              <path d="M12 8 L15 14 L12 20 L9 14 Z" fill="rgba(201,149,107,0.1)"/>
              <path d="M48 8 L51 14 L48 20 L45 14 Z" fill="rgba(201,149,107,0.1)"/>
            </g>
          </svg>
          <span class="ornament-line-right"></span>
        </div>

        <p id="hero-date" class="hero-date shimmer-text"></p>
        <p id="hero-place" class="eyebrow" style="margin-top:0.75rem;"></p>

        <div id="hero-scroll-hint">
          <span id="scroll-hint-text"></span>
          <span class="scroll-line"></span>
        </div>
      </div>
    </section>

    <!-- ── THEIR STORY ────────────────────────────────────── -->
    <section id="story">
      <div id="story-inner">
        <div id="story-header" data-reveal="up">
          <p id="story-eyebrow" class="eyebrow"></p>
          <h2>
            <span id="story-title-a" class="story-script shimmer-text"></span>
            <span id="story-title-b"></span>
          </h2>
          <div class="ornament" aria-hidden="true">
            <span class="ornament-line-left"></span>
            <svg width="44" height="44" viewBox="0 0 44 44" class="ornament-icon sway-slow">
              <g fill="none" stroke="currentColor" stroke-width="0.8">
                <path d="M22 6 L28 18 L22 30 L16 18 Z"/>
                <path d="M22 10 L26 18 L22 26 L18 18 Z" fill="currentColor" fill-opacity="0.15"/>
                <circle cx="22" cy="18" r="2" fill="currentColor"/>
              </g>
            </svg>
            <span class="ornament-line-right"></span>
          </div>
        </div>
        <div id="story-list"></div>
      </div>
    </section>

    <!-- ── COUNTDOWN ─────────────────────────────────────── -->
    <section id="countdown">
      <div id="countdown-inner">
        <div data-reveal="up">
          <p id="cd-eyebrow" class="eyebrow"></p>
          <h2>
            <span id="cd-title"></span>
            <span id="cd-script" class="countdown-script shimmer-text"></span>
          </h2>
          <div class="ornament" aria-hidden="true">
            <span class="ornament-line-left"></span>
            <svg width="44" height="44" viewBox="0 0 44 44" class="ornament-icon sway-slow">
              <g fill="none" stroke="currentColor" stroke-width="0.8">
                <path d="M22 6 L28 18 L22 30 L16 18 Z"/>
                <path d="M22 10 L26 18 L22 26 L18 18 Z" fill="currentColor" fill-opacity="0.15"/>
                <circle cx="22" cy="18" r="2" fill="currentColor"/>
              </g>
            </svg>
            <span class="ornament-line-right"></span>
          </div>
        </div>
        <div id="countdown-grid">
          <div class="countdown-cell" data-reveal="up" data-delay="0">
            <div class="countdown-card">
              <div id="cd-d-num" class="countdown-number">00</div>
              <div id="cd-d-lbl" class="countdown-label eyebrow"></div>
            </div>
            <span class="countdown-sep heartbeat">◆</span>
          </div>
          <div class="countdown-cell" data-reveal="up" data-delay="120">
            <div class="countdown-card">
              <div id="cd-h-num" class="countdown-number">00</div>
              <div id="cd-h-lbl" class="countdown-label eyebrow"></div>
            </div>
            <span class="countdown-sep heartbeat">◆</span>
          </div>
          <div class="countdown-cell" data-reveal="up" data-delay="240">
            <div class="countdown-card">
              <div id="cd-m-num" class="countdown-number">00</div>
              <div id="cd-m-lbl" class="countdown-label eyebrow"></div>
            </div>
            <span class="countdown-sep heartbeat">◆</span>
          </div>
          <div class="countdown-cell" data-reveal="up" data-delay="360">
            <div class="countdown-card">
              <div id="cd-s-num" class="countdown-number">00</div>
              <div id="cd-s-lbl" class="countdown-label eyebrow"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ── LETTER ─────────────────────────────────────────── -->
    <section id="letter">
      <div id="letter-inner">
        <div data-reveal="up">
          <p id="letter-eyebrow" class="eyebrow"></p>
          <h2 id="letter-title"></h2>
          <div class="ornament" aria-hidden="true">
            <span class="ornament-line-left"></span>
            <svg width="44" height="44" viewBox="0 0 44 44" class="ornament-icon sway-slow">
              <g fill="none" stroke="currentColor" stroke-width="0.8">
                <path d="M22 6 L28 18 L22 30 L16 18 Z"/>
                <path d="M22 10 L26 18 L22 26 L18 18 Z" fill="currentColor" fill-opacity="0.15"/>
                <circle cx="22" cy="18" r="2" fill="currentColor"/>
              </g>
            </svg>
            <span class="ornament-line-right"></span>
          </div>
          <p id="letter-body">
            <span id="letter-p1a"></span><em id="letter-p1b"></em><span id="letter-p1c"></span>
            <br/><br/>
            <span id="letter-p2a"></span><em id="letter-p2b"></em>
          </p>
          <div id="letter-sign" class="letter-sign"></div>
        </div>
      </div>
    </section>

    <!-- ── JOURNEY ────────────────────────────────────────── -->
    <section id="journey">
      <div id="journey-inner">
        <div id="journey-header" data-reveal="up">
          <p id="journey-eyebrow" class="eyebrow"></p>
          <h2>
            <span id="journey-title-a" class="journey-script shimmer-text"></span>
            <span id="journey-title-b"></span>
          </h2>
          <div class="ornament" aria-hidden="true">
            <span class="ornament-line-left"></span>
            <svg width="44" height="44" viewBox="0 0 44 44" class="ornament-icon sway-slow">
              <g fill="none" stroke="currentColor" stroke-width="0.8">
                <path d="M22 6 L28 18 L22 30 L16 18 Z"/>
                <path d="M22 10 L26 18 L22 26 L18 18 Z" fill="currentColor" fill-opacity="0.15"/>
                <circle cx="22" cy="18" r="2" fill="currentColor"/>
              </g>
            </svg>
            <span class="ornament-line-right"></span>
          </div>
        </div>
        <div id="journey-list"></div>
      </div>
    </section>

    <!-- ── VENUE ──────────────────────────────────────────── -->
    <section id="venue">
      <div id="venue-inner">
        <div data-reveal="left">
          <p id="venue-eyebrow" class="eyebrow"></p>
          <h2>
            <span id="venue-title-a"></span><br/>
            <span id="venue-title-b" class="venue-script shimmer-text"></span>
          </h2>
          <div class="ornament" aria-hidden="true">
            <span class="ornament-line-left"></span>
            <svg width="44" height="44" viewBox="0 0 44 44" class="ornament-icon sway-slow">
              <g fill="none" stroke="currentColor" stroke-width="0.8">
                <path d="M22 6 L28 18 L22 30 L16 18 Z"/>
                <path d="M22 10 L26 18 L22 26 L18 18 Z" fill="currentColor" fill-opacity="0.15"/>
                <circle cx="22" cy="18" r="2" fill="currentColor"/>
              </g>
            </svg>
            <span class="ornament-line-right"></span>
          </div>
          <p id="venue-body">
            <span id="venue-p1a"></span><em id="venue-p1b"></em><span id="venue-p1c"></span>
            <br/><br/>
            <span id="venue-p2"></span>
          </p>
          <p id="venue-address"></p>
          <a id="venue-map-link" href="https://maps.google.com/?q=Jumeirah+Beach+Hotel+Dubai" target="_blank" rel="noreferrer">
            <svg style="width:0.75rem;height:0.75rem;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path d="M12 21s-7-5-7-10a7 7 0 0114 0c0 5-7 10-7 10z"/>
              <circle cx="12" cy="11" r="2.5"/>
            </svg>
            <span id="venue-map"></span>
          </a>
        </div>

        <div class="venue-img-wrap" data-reveal="right">
          <div class="venue-corner-tl"></div>
          <img
            src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1200&auto=format&fit=crop&q=85"
            alt="Jumeirah Beach Hotel, Dubai — a luxury beachfront hotel at night with the Burj Al Arab in the background"
            loading="lazy"
            width="1200"
            height="840"
            style="width:100%;height:100%;object-fit:cover;display:block;"
          />
          <div class="venue-corner-br"></div>
        </div>
      </div>
    </section>

    <!-- ── GUIDELINES ─────────────────────────────────────── -->
    <section id="guidelines">
      <div id="guidelines-inner">
        <div data-reveal="up">
          <p id="guidelines-eyebrow" class="eyebrow"></p>
          <h2>
            <span id="guidelines-title-a" class="guidelines-script shimmer-text"></span>
            <span id="guidelines-title-b"></span>
          </h2>
          <div class="ornament" aria-hidden="true">
            <span class="ornament-line-left"></span>
            <svg width="44" height="44" viewBox="0 0 44 44" class="ornament-icon sway-slow">
              <g fill="none" stroke="currentColor" stroke-width="0.8">
                <path d="M22 6 L28 18 L22 30 L16 18 Z"/>
                <path d="M22 10 L26 18 L22 26 L18 18 Z" fill="currentColor" fill-opacity="0.15"/>
                <circle cx="22" cy="18" r="2" fill="currentColor"/>
              </g>
            </svg>
            <span class="ornament-line-right"></span>
          </div>
        </div>
        <div id="guidelines-grid"></div>
      </div>
    </section>

    <!-- ── RSVP ───────────────────────────────────────────── -->
    <section id="rsvp">
      <div id="rsvp-inner">
        <div data-reveal="up">
          <div class="rsvp-hearts">
            <svg class="svg-heart float-slow" style="width:1.25rem;height:1.25rem;" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21s-7-4.35-9.5-9C1 8.5 3 5 6.5 5c2 0 3.5 1 5.5 3 2-2 3.5-3 5.5-3C21 5 23 8.5 21.5 12 19 16.65 12 21 12 21z"/>
            </svg>
            <svg class="svg-heart float-slow heartbeat" style="width:1.75rem;height:1.75rem;animation-delay:0.5s;" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21s-7-4.35-9.5-9C1 8.5 3 5 6.5 5c2 0 3.5 1 5.5 3 2-2 3.5-3 5.5-3C21 5 23 8.5 21.5 12 19 16.65 12 21 12 21z"/>
            </svg>
            <svg class="svg-heart float-slow" style="width:1.25rem;height:1.25rem;animation-delay:1s;" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21s-7-4.35-9.5-9C1 8.5 3 5 6.5 5c2 0 3.5 1 5.5 3 2-2 3.5-3 5.5-3C21 5 23 8.5 21.5 12 19 16.65 12 21 12 21z"/>
            </svg>
          </div>
          <h2><span id="rsvp-title" class="rsvp-title shimmer-text"></span></h2>
          <p id="rsvp-by"></p>
          <div class="ornament" aria-hidden="true">
            <span class="ornament-line-left"></span>
            <svg width="44" height="44" viewBox="0 0 44 44" class="ornament-icon sway-slow">
              <g fill="none" stroke="currentColor" stroke-width="0.8">
                <path d="M22 6 L28 18 L22 30 L16 18 Z"/>
                <path d="M22 10 L26 18 L22 26 L18 18 Z" fill="currentColor" fill-opacity="0.15"/>
                <circle cx="22" cy="18" r="2" fill="currentColor"/>
              </g>
            </svg>
            <span class="ornament-line-right"></span>
          </div>
          <a id="rsvp-btn" href="mailto:mohammad.yara.2027@example.com">
            <svg class="svg-heart heartbeat" style="width:1rem;height:1rem;flex-shrink:0" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21s-7-4.35-9.5-9C1 8.5 3 5 6.5 5c2 0 3.5 1 5.5 3 2-2 3.5-3 5.5-3C21 5 23 8.5 21.5 12 19 16.65 12 21 12 21z"/>
            </svg>
            <span id="rsvp-btn-text"></span>
          </a>
          <p id="rsvp-foot" class="rsvp-foot"></p>
        </div>
      </div>
    </section>

    <!-- ── FOOTER ─────────────────────────────────────────── -->
    <footer id="footer">
      <span id="footer-pre"></span>
      <svg class="footer-heart svg-heart heartbeat" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--rose-gold)">
        <path d="M12 21s-7-4.35-9.5-9C1 8.5 3 5 6.5 5c2 0 3.5 1 5.5 3 2-2 3.5-3 5.5-3C21 5 23 8.5 21.5 12 19 16.65 12 21 12 21z"/>
      </svg>
      <span id="footer-tail"></span>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
